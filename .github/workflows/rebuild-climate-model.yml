name: Rebuild climate model

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-climate-model
  cancel-in-progress: false

jobs:
  rebuild:
    name: Collect, train and forecast
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Rebuild climate artifacts
        run: python -m scripts.build_pipeline

      - name: Validate generated artifacts
        run: |
          test -s data/climate_history.csv
          test -s data/climate_forecast.csv
          test -s models/climate_model.joblib
          test -s models/model_metadata.json
          python -m json.tool models/model_metadata.json > /dev/null

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ecotrack-climate-model-${{ github.run_number }}
          path: |
            Backend/data/climate_history.csv
            Backend/data/climate_forecast.csv
            Backend/models/climate_model.joblib
            Backend/models/model_metadata.json
          if-no-files-found: error
          retention-days: 14
